name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare public website files
        run: |
          mkdir -p _site/assets/audio
          cp index.html app.js styles.css study-materials.js _site/
          cp assets/audio/s8e6.m4a _site/assets/audio/
          cp pages-config.js _site/config.js
          mkdir -p _site/lite
          cp index.html _site/lite/index.html
          cp pages-config.js _site/lite/config.js
          sed -i 's|href="styles.css"|href="../styles.css"|; s|src="study-materials.js"|src="../study-materials.js"|; s|src="app.js?|src="../app.js?|' _site/lite/index.html
          sed 's|assets/audio/|../assets/audio/|g' study-materials.js > _site/lite/study-materials.js
          sed -i 's|src="../study-materials.js"|src="study-materials.js"|' _site/lite/index.html
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
