<div class="grid-2"><div class="card"><h2>研究流程</h2><div class="stage-list">${[['01','说明与同意','约5分钟'],['02','背景与检索任务','约20分钟'],['03','结构与数量测试','约20分钟'],['04','选择与访谈','约15分钟']].map(x=>`<div class="stage"><b>${x[0]}</b><div>${x[1]}</div><small>${x[2]}</small></div>`).join('')}</div></div><div class="card"><h2>参与说明</h2><p>整个过程约60分钟，需要同时使用手机和电脑。你可以随时中止，也可以跳过明确允许跳过的问题。</p><label class="checkline"><input id="consentStudy" type="checkbox"><span>我已阅读研究说明，自愿参加本研究。</span></label><label class="checkline"><input id="consentScreen" type="checkbox"><span>我理解手机录屏的用途与范围，并会避免录入通知、私人聊天等无关内容。</span></label><div class="actions"><button class="btn" id="consentNext" disabled>同意并继续</button></div></div></div>`),
pre:()=>wrap(`<div class="eyebrow">Stage 02 · Pre-interview</div><h1>先了解你的收听习惯</h1><div class="card"><div class="notice">参与者ID：<b>${state.participantId}</b>。请勿填写真实姓名。</div><form id="preForm"><div class="grid-2"><div><label>年龄段</label><select name="age" required><option value="">请选择</option><option>18–24</option><option>25–34</option><option>35–44</option><option>45–54</option><option>55及以上</option></select></div><div><label>收听播客频率</label><select name="frequency" required><option value="">请选择</option><option>每天</option><option>每周数次</option><option>每周一次</option><option>两周一次</option><option>更少</option><option>从不</option></select></div></div><label>常用播客平台（可多选）</label><div class="choice-grid">${['小宇宙','喜马拉雅','苹果播客','Spotify','YouTube','其他'].map(x=>`<label class="choice"><input type="checkbox" name="platform" value="${x}"><span>${x}</span></label>`).join('')}</div><div class="grid-2"><div><label>通常如何寻找新播客？</label><select name="discovery" required><option value="">请选择</option><option>播客平台内部推荐</option><option>外部网站或社交媒体</option><option>朋友推荐</option><option>其他</option></select></div><div><label>对《岩中花述》的熟悉程度</label><select name="familiarity" required><option value="">请选择</option><option>未听说过</option><option>听说过但没听过</option><option>听过2–3期</option><option>听过4期及以上</option><option>几乎每一期</option></select></div></div><div class="actions"><button class="btn" type="submit">提交背景信息</button></div></form></div>`),
t1intro:()=>wrap(`<div class="eyebrow">Stage 03 · Task 1</div><h1>真实平台检索</h1><div class="grid-2"><div class="card"><h2>任务规则</h2><ul><li>共4道任务，每题限制时间为3分钟。</li><li>按题目要求使用手机中的小宇宙与电脑辅助页面。</li><li>找到答案后填写在输入框内，点击“完成”。</li><li>主持人不会提供额外内容提示。</li><li>请尽可能在限制时间内完成；超时10秒后将自动跳转到下一题。</li></ul></div><div class="card"><h2>开始前检查</h2><label class="checkline"><input id="screenReady" type="checkbox"><span>手机已打开《岩中花述》栏目并开始屏幕录制。</span></label><label class="checkline"><input id="notifyReady" type="checkbox"><span>已确认不会录入通知或私人信息。</span></label><div class="actions"><button class="btn" id="t1Begin" disabled>准备好了，开始任务</button></div></div></div>`),
t1:()=>{const q=task1[state.task1Index]||task1[0];setTimeout(()=>startTask1Timer(()=>finishT1('timeout')),0);return wrap(`<div class="task-head"><div><div class="eyebrow">${q.id} · ${q.type}</div><h2>${q.assist?'有可视化辅助':'无辅助条件'}</h2></div><div><div class="muted" id="timerLabel">剩余时间</div><div class="timer" id="timer">03:00</div></div></div><div class="card"><div class="prompt">${q.prompt}</div>${q.assist?assistViz(q):`<div class="notice">请只使用手机中的小宇宙完成本题。电脑端不提供内容辅助。</div>`}<label>你的答案</label><input id="t1answer" class="text-input" placeholder="例如：S8E9；约19–21分钟"><div class="actions"><button class="btn secondary" onclick="finishT1('abandoned')">放弃</button><button class="btn" onclick="finishT1('completed')">完成并提交</button></div></div>`)} ,
t1feedback:()=>wrap(`<div class="eyebrow">Task 1 · Feedback</div><h1>可视化系统中，你认为各项功能起到的帮助是？</h1><p class="muted">请结合截图回忆刚才使用的功能。未实际看到或使用的功能请选择“不适用／未看到”。</p><div class="feature-grid" id="feedbackForm">${feedbackFeatures().map((f,i)=>`<div class="feature-card"><div class="feature-shot ${f.cls}"><img src="${f.img}" alt="${f.title}界面截图"></div><h3>${f.title}</h3><p class="muted">${f.desc}</p>${rating('该功能对完成任务的帮助程度','f'+i)}</div>`).join('')}</div><div class="actions"><button class="btn" id="feedbackSubmit">继续 Task 2</button></div>`),
t2a:()=>{setTimeout(()=>startTimer(60000,()=>finishT2A('timeout')),0);const seq=['list','network','cluster','tree'],layout=seq[state.t2aIndex];const qs=[['属性检索','请找到嘉宾为“蔡皋”的一期播客。'],['主题检索','请找到主要讨论伊朗社会、战争经历与女性记者身份的一期播客。'],['关联检索','请找到与“没有魅力的人，也值得拥有世界”在内容主题上最相关的另一集。'],['主题检索','请找到主要讨论竞技体育、奥运经历与退役转型的一期播客。']];return wrap(`<div class="task-head"><div><div class="eyebrow">Task 2-A · ${['A 传统列表','B 自由关联网络','C 主题聚类网络','D 层级树状网络'][state.t2aIndex]}</div><h2>${qs[state.t2aIndex][0]}</h2></div><div><div class="muted">剩余时间</div><div class="timer" id="timer">01:00</div></div></div><div class="prompt">${qs[state.t2aIndex][1]}</div><p class="muted">卡片直接显示嘉宾、主题归属与播放量；点击卡片进行选择。</p><div class="viz-shell"><div class="viz-area layout-${layout}" id="episodeViz">${layoutHTML(layout,20)}</div></div><div class="actions"><button class="btn secondary" onclick="finishT2A('abandoned')">放弃</button><button class="btn" id="confirmEpisode" disabled onclick="finishT2A('completed')">确认答案</button></div>`)},
t2b:()=>{const conditions=[];['A','B','C','D'].forEach(s=>[5,10,15].forEach(n=>conditions.push({s,n})));const c=conditions[state.t2bIndex]||conditions[0];setTimeout(()=>startTimer(30000,()=>toast('30秒已到，请完成评分')),0);return wrap(`<div class="task-head"><div><div class="eyebrow">Task 2-B · 条件 ${c.s}${c.n}</div><h2>观察信息布局</h2><p class="muted">左侧以 iPhone 17 比例完整呈现；无需滚动、缩放或拖动。</p></div><div><div class="muted">建议观察时间</div><div class="timer" id="timer">00:30</div></div></div><div class="grid-2"><div class="phone-stage" id="miniViz">${miniLayout(c.s,c.n)}</div><div class="card"><div data-question="clarity"><label>信息布局有多容易理解？</label><div class="scale" data-value="">${[1,2,3,4,5,6,7].map(n=>`<button data-scale="${n}">${n}</button>`).join('')}</div><div class="muted">1 完全难以理解 — 7 非常容易理解</div></div><div data-question="crowding"><label>你觉得界面中的信息有多拥挤？</label><div class="scale" data-value="">${[1,2,3,4,5,6,7].map(n=>`<button data-scale="${n}">${n}</button>`).join('')}</div><div class="muted">1 完全不拥挤 — 7 非常拥挤</div></div><div class="actions"><button class="btn" id="t2bNext">提交评分</button></div></div></div>`)},
t2c:()=>wrap(`<div class="eyebrow">Task 2-C · 情景选择</div><h1>挑选一集想听的节目</h1><p class="prompt">假设你有一段空闲时间，想寻找一集感兴趣、还没有听过的播客，最好是和个人生活和成长有关的。</p><div class="field-picker"><b>显示信息（已选 <span id="fieldCount">${state.selectedFields.length}</span>/3）</b><p class="muted" style="margin:3px 0 9px">初始列表只显示单集标题；选择按钮后，相应信息会在所有单集中统一出现。</p><div class="field-options" id="fieldOptions">${['主题','嘉宾','摘要','评论','时长','热度'].map(f=>`<label><input type="checkbox" value="${f}" ${state.selectedFields.includes(f)?'checked':''}><span>${f}</span></label>`).join('')}</div></div><div id="selectionList">${episodeRows()}</div><div class="actions"><button class="btn" id="confirmChoice" ${state.answers.t2cEpisode?'':'disabled'}>确认选择</button></div>`),
t2cfb:()=>wrap(`<div class="eyebrow">Task 2-C · 选择反馈</div><h1>回顾刚才的选择</h1><div class="card"><div data-question="confidence">${rating('你有多大信心认为刚才选择的播客符合自己的兴趣？','confidence',false)}</div><label>哪些信息对刚才的选择最有帮助？（最多3项）</label><div class="choice-grid" id="helpful">${['标题','嘉宾','主题','摘要','评论','时长','热度'].map(x=>`<label class="choice"><input type="checkbox" value="${x}"><span>${x}</span></label>`).join('')}</div><label>为什么最终选择这一集？</label><textarea id="choiceReason" placeholder="可以简短说明，也可由主持人口头追问后记录。"></textarea><div class="actions"><button class="btn" id="choiceFeedback">继续排序</button></div></div>`),
ranking:()=>wrap(`<div class="eyebrow">Task 2-C · 信息排序</div><h1>哪些信息最重要？</h1><p>回想你平时发现一集感兴趣、尚未收听的播客时，请按住卡片并拖动，从重要到不重要排序。</p><div class="card"><div class="rank-list" id="rankList">${rankHTML()}</div><div class="actions"><button class="btn" id="rankSubmit">完成排序</button></div></div>`),
interview:()=>wrap(`<div class="hero"><div><div class="eyebrow">Final stage</div><h1>Semi-structured<br>Interview</h1><p>这一阶段由主持人同时进行。网站只记录访谈阶段的开始与结束时间，不进行录音或自动转写。</p><div class="actions" style="justify-content:flex-start"><button class="btn" id="interviewStart">开始计时</button><button class="btn secondary" id="interviewEnd" disabled>结束访谈并完成研究</button></div></div><div class="card"><div class="muted">访谈已进行</div><div class="timer" id="timer">00:00</div></div></div>`),
complete:()=>wrap(`<div class="hero"><div><div class="eyebrow">Study complete</div><h1>谢谢你的参与</h1><p>本次研究流程已经完成。请在关闭页面前告知主持人，由研究者确认数据已保存。</p><div class="actions" style="justify-content:flex-start"><button class="btn" onclick="exportCSV()">导出本参与者 CSV</button><button class="btn secondary" onclick="exportJSON()">导出完整 JSON</button></div></div><div class="art"><span>${state.participantId}</span></div></div><div class="notice">当前HTML原型使用本机浏览器存储。正式研究部署前，应接入受控数据库、权限和隐私政策。</div>`),

};
function feedbackFeatures(){return [
 {title:'主题关键词与主题位置',desc:'查看各主题类别、持续时间，以及主题在节目时间轴中的分布。',img:'assets/beneath-overview.png',cls:'overview'},
 {title:'逐字转写与文本定位',desc:'结合单集时间轴和文本内容，判断具体讨论出现的位置。',img:'assets/beneath-detail.png',cls:'summary'},
 {title:'主要观点与内容摘要',desc:'通过单集介绍、主题概览和代表性内容快速判断节目是否相关。',img:'assets/beneath-detail.png',cls:'topic'},
 {title:'情绪与情感信息',desc:'查看不同片段的情绪方向、强度以及随时间发生的变化。',img:'assets/beneath-detail.png',cls:'sentiment'}
]}
function assistViz(){return `<div class="assist-link"><div><b>请打开 Beneath the Conversation 辅助查找</b><code>https://yundouzi.github.io/Beneath-conversation/</code><p class="muted">线上正式版目前为英文界面，会在新标签页中打开。</p></div><a class="btn" href="https://yundouzi.github.io/Beneath-conversation/" target="_blank" rel="noopener">打开可视化网站 ↗</a></div><div class="assist-link"><div><b>中文历史版（本地备用）</b><p class="muted">这是项目中已有的较早中文多期交互面板，并非线上英文版的逐字翻译。</p></div><a class="btn secondary" href="assets/beneath-legacy-cn.html" target="_blank">打开中文历史版 ↗</a></div>`}
function rating(text,id,na=true){return `<div data-question="${id}" style="margin-bottom:24px"><label>${text}</label><div class="scale" data-value="">${[1,2,3,4,5,6,7].map(n=>`<button type="button" data-scale="${n}">${n}</button>`).join('')}</div>${na?`<label class="checkline"><input type="checkbox" data-na="${id}"><span>不适用／未看到</span></label>`:''}</div>`}
function episodeCard(e){return `<h3>${e.id} 鲁豫对话${e.guest}｜${e.title}</h3><p><b>嘉宾：</b>${e.guest}</p><p><b>主题：</b>${e.topics.join('、')}</p><p><b>摘要：</b>${e.summary}</p><p><b>时长：</b>${e.duration}</p><p><b>播放：</b>${compactNumber(e.plays)}次　<b>评论：</b>${e.commentCount}条</p>`}
function compactNumber(n){n=Number(n)||0;return n>=10000?(n/10000).toFixed(n>=1000000?1:1)+'万':String(n)}
function xyRow(e,selectable=false){const theme=themeInfo[primaryTheme(e.id)];return `<div class="${selectable?'episode-row ':''}xy-row ${selectable&&state.answers.t2cEpisode===e.id?'selected':''}" ${selectable?`data-choice="${e.id}"`:''}><div class="pod-cover">岩中<br>花述</div><div class="xy-main"><h3>${e.id} 鲁豫对话${e.guest}｜${e.title}</h3><div class="xy-desc">本期嘉宾：${e.guest} · ${e.summary}</div><div class="xy-stats"><span>${theme.label}</span><span>${e.duration}</span><span>${e.date}</span><span>◉ ${compactNumber(e.plays)}</span><span>▣ ${e.commentCount}</span></div>${selectable&&state.selectedFields.length?`<div class="meta" style="margin-top:8px">${state.selectedFields.map(f=>`<span><b>${f}：</b>${fieldValue(e,f)}</span>`).join('')}</div>`:''}</div><button class="play-dot" tabindex="-1" aria-hidden="true">▶</button></div>`}
function themeKeyFromEnglish(name){return ({'Personal Growth':'growth','Relationships':'relations','Literature & Art':'art','Career & Creation':'career','Identity & Gender':'identity','Other':'other'})[name]||'other'}
function primaryTheme(id){const p=themeProfiles[id]||{other:100};return Object.entries(p).sort((a,b)=>b[1]-a[1])[0][0]}
function profileSimilarity(a,b){const pa=themeProfiles[a]||{},pb=themeProfiles[b]||{},keys=Object.keys(themeInfo);let dot=0,aa=0,bb=0;keys.forEach(k=>{const x=pa[k]||0,y=pb[k]||0;dot+=x*y;aa+=x*x;bb+=y*y});return aa&&bb?dot/Math.sqrt(aa*bb):0}
function compactNetworkPositions(es){const keys=Object.keys(themeInfo),anchors=[[24,34],[47,22],[74,32],[76,67],[49,69],[24,70]],patterns={1:[[0,0]],2:[[-6,-6],[7,7]],3:[[-8,-7],[7,-8],[0,8]],4:[[-8,-8],[7,-7],[-7,8],[8,8]],5:[[-9,-10],[2,-11],[9,-1],[-7,8],[5,10]],6:[[-10,-12],[1,-13],[16,-3],[-9,3],[-19,17],[12,13]]},positions=new Array(es.length);keys.forEach((k,ki)=>{const members=es.map((e,i)=>({e,i})).filter(x=>primaryTheme(x.e.id)===k),pts=patterns[Math.min(6,members.length)]||patterns[6];members.forEach((m,j)=>{const p=pts[j%pts.length],a=anchors[ki];positions[m.i]=[a[0]+p[0],a[1]+p[1]]})});return positions}
function clusterDotPosition(i,total){const sets={1:[[50,54]],2:[[28,43],[72,61]],3:[[22,36],[73,32],[51,72]],4:[[22,34],[70,30],[30,72],[78,70]],5:[[18,31],[52,25],[82,38],[31,72],[69,73]],6:[[17,28],[50,24],[82,33],[22,70],[54,66],[84,75]]};const points=sets[Math.min(total,6)]||sets[6];return points[i%points.length]}
function studyListHTML(es){return `<div class="reference-list">${es.map(e=>{const t=themeInfo[primaryTheme(e.id)];return `<button class="reference-list-row" data-episode="${e.id}" onclick="selectEpisodeNode(this)" style="--node-color:${t.color}"><i class="reference-list-dot">${e.id.replace(/^S/,'')}</i><span class="reference-list-copy"><b>${e.id} 鲁豫对话${e.guest}｜${e.title}</b><small>${t.label} · ${compactNumber(e.plays)}次播放 · ${e.duration}</small></span><em>${e.guest}</em></button>`}).join('')}</div>`}
function studyNetworkHTML(es){
 const edges=[],seen=new Set();
 es.forEach((e,i)=>{const ranked=es.map((x,j)=>({j,score:i===j?-1:profileSimilarity(e.id,x.id)})).sort((a,b)=>b.score-a.score),chosen=[ranked[0]];if(ranked[1]?.score>.93)chosen.push(ranked[1]);chosen.forEach(r=>{const key=[i,r.j].sort((a,b)=>a-b).join('-');if(!seen.has(key)){seen.add(key);edges.push({a:i,b:r.j,score:r.score})}})});
 const positions=compactNetworkPositions(es,edges);
 const lines=edges.map(x=>`<line class="${x.score>.9?'strong':''}" x1="${positions[x.a][0]}" y1="${positions[x.a][1]}" x2="${positions[x.b][0]}" y2="${positions[x.b][1]}"></line>`).join('');
 const cards=es.map((e,i)=>{const k=primaryTheme(e.id),t=themeInfo[k];return `<button class="network-node" data-episode="${e.id}" onclick="selectEpisodeNode(this)" style="left:${positions[i][0]}%;top:${positions[i][1]}%;--node-color:${t.color}" title="${e.title}"><i class="network-dot">${e.id}</i><span class="network-caption"><b>${e.guest}</b><em>${compactNumber(e.plays)}播放</em></span></button>`}).join('');
 const legend=Object.values(themeInfo).map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join('');
 return `<div class="network-canvas"><svg class="network-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${cards}<div class="network-legend">${legend}<span class="line-key"><i></i>主题相似</span><span class="line-key strong"><i></i>高度相似</span></div></div>`
}
function studyClusterHTML(es){return `<div class="cluster-board">${Object.entries(themeInfo).map(([k,t],gi)=>{const items=es.filter(e=>primaryTheme(e.id)===k);return `<section class="topic-cluster blob-${gi+1}" style="--cluster-color:${t.color}"><h3>${t.label}<small>${items.length}期</small></h3><div class="cluster-items">${items.map((e,i)=>{const p=clusterDotPosition(i,items.length);return `<button class="cluster-dot" data-episode="${e.id}" onclick="selectEpisodeNode(this)" style="left:${p[0]}%;top:${p[1]}%" title="${e.title}"><i>${e.id}</i><span><b>${e.guest}</b><em>${compactNumber(e.plays)}播放</em></span></button>`}).join('')}</div></section>`}).join('')}</div>`}
function treeHTML(es){const entries=Object.entries(themeInfo),centers=[8.5,25,41.5,58.5,75,91.5],links=[],themes=[],leaves=[];entries.forEach(([k,t],gi)=>{const cx=centers[gi],items=es.filter(e=>primaryTheme(e.id)===k);links.push(`<line x1="50" y1="11" x2="${cx}" y2="27"></line>`);themes.push(`<div class="tree-theme-node" style="left:${cx}%;top:27%;--tree-color:${t.color}">${t.label}</div>`);items.forEach((e,i)=>{const row=Math.floor(i/2),start=row*2,count=Math.min(2,items.length-start),local=i-start,lx=cx+(local-(count-1)/2)*7.2,ly=49+row*22;links.push(`<line x1="${cx}" y1="31" x2="${lx}" y2="${ly-3}"></line>`);leaves.push(`<button class="tree-leaf-node" data-episode="${e.id}" onclick="selectEpisodeNode(this)" style="left:${lx}%;top:${ly}%;--tree-color:${t.color}" title="${e.title}"><i>${e.id}</i><span><b>${e.guest}</b><em>${compactNumber(e.plays)}播放</em></span></button>`)})});return `<div class="reference-tree"><svg class="tree-links" viewBox="0 0 100 100" preserveAspectRatio="none">${links.join('')}</svg><div class="tree-root-node">岩中花述</div>${themes.join('')}${leaves.join('')}</div>`}
function layoutHTML(type,n){const es=episodes.slice(0,n);if(type==='list')return studyListHTML(es);if(type==='network')return studyNetworkHTML(es);if(type==='cluster')return studyClusterHTML(es);return treeHTML(es)}
function phoneNetworkPositions(es){const layouts={5:[[18,18],[52,12],[82,26],[30,58],[70,78]],10:[[18,13],[50,17],[82,12],[24,37],[57,40],[84,36],[17,64],[48,61],[79,66],[52,86]],15:[[18,11],[50,13],[82,10],[23,29],[55,31],[84,28],[16,48],[48,46],[79,49],[23,66],[54,64],[85,68],[17,85],[49,83],[81,86]]};const points=layouts[es.length]||layouts[15];return es.map((e,i)=>points[i%points.length])}
function phoneNetwork(es){const pos=phoneNetworkPositions(es),lines=[];Object.keys(themeInfo).forEach(k=>{const ids=es.map((e,i)=>({e,i})).filter(x=>themeKeyFromEnglish(x.e.primary)===k);for(let n=1;n<ids.length;n++){const a=ids[n-1].i,b=ids[n].i;lines.push(`<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"></line>`)}});const representatives=Object.keys(themeInfo).map(k=>es.findIndex(e=>themeKeyFromEnglish(e.primary)===k)).filter(i=>i>=0);for(let i=1;i<representatives.length;i++){const a=representatives[i-1],b=representatives[i];lines.push(`<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" opacity=".45"></line>`)}return `<div class="phone-network"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines.join('')}</svg>${es.map((e,i)=>{const t=themeInfo[themeKeyFromEnglish(e.primary)];return `<div class="phone-dot-node" style="left:${pos[i][0]}%;top:${pos[i][1]}%;--node-color:${t.color}"><i>${e.id}</i><span>${e.guest}<em>${compactNumber(e.plays)}</em></span></div>`}).join('')}</div>`}
function phoneClusterPosition(i,total){const sets={1:[[50,58]],2:[[27,57],[73,57]],3:[[27,40],[73,40],[50,75]],4:[[27,39],[73,39],[27,74],[73,74]],5:[[27,34],[73,34],[27,62],[73,62],[50,86]],6:[[27,31],[73,31],[27,58],[73,58],[27,85],[73,85]]};const pts=sets[Math.min(total,6)]||sets[6];return pts[i%pts.length]}
function phoneClusters(es){return `<div class="phone-clusters">${Object.entries(themeInfo).map(([k,t],gi)=>{const items=es.filter(e=>themeKeyFromEnglish(e.primary)===k);return `<section class="phone-cluster blob-${gi+1}" style="--cluster-color:${t.color}"><strong>${t.label}</strong><div>${items.map((e,i)=>{const p=phoneClusterPosition(i,items.length);return `<span class="phone-cluster-dot" style="left:${p[0]}%;top:${p[1]}%"><i>${e.id}</i><em>${e.guest}</em></span>`}).join('')}</div></section>`}).join('')}</div>`}
function phoneTree(es){const groups=Object.entries(themeInfo).map(([k,t])=>{const items=es.filter(e=>themeKeyFromEnglish(e.primary)===k);return `<section class="phone-tree-group-card" style="--tree-color:${t.color}"><strong class="phone-tree-theme">${t.label}</strong><div class="phone-tree-leaves">${items.map(e=>`<span class="phone-tree-leaf" style="--tree-color:${t.color}"><i>${e.id}</i><em>${e.guest}</em></span>`).join('')}</div></section>`}).join('');return `<div class="phone-tree"><div class="phone-tree-root">岩中花述</div><div class="phone-tree-groups">${groups}</div></div>`}
function miniLayout(s,n){const es=phoneEpisodes.slice(0,n);let content='';if(s==='A')content=`<div class="phone-list" style="grid-template-rows:repeat(${n},1fr)">${es.map(e=>{const t=themeInfo[themeKeyFromEnglish(e.primary)];return `<div class="phone-list-row" style="--node-color:${t.color}"><i class="phone-list-dot"></i><span class="phone-list-info"><b>${e.id} 鲁豫对话${e.guest}｜${e.title}</b><em>${t.label} · ${compactNumber(e.plays)}播放</em></span></div>`}).join('')}</div>`;if(s==='B')content=phoneNetwork(es);if(s==='C')content=phoneClusters(es);if(s==='D')content=phoneTree(es);return `<div class="phone-shell density-${n}"><div class="phone-screen"><div class="phone-status"><span>9:41</span><span>● ● ▰</span></div><div class="phone-caption">岩中花述 · ${n}期 · ${['列表','自由网络','主题聚类','层级树状']['ABCD'.indexOf(s)]}</div><div class="phone-content">${content}</div></div></div>`}
function episodeRows(){return episodes.map(e=>`<div class="choice-episode ${state.answers.t2cEpisode===e.id?'selected':''}" data-choice="${e.id}"><div class="choice-title">${e.id} 鲁豫对话${e.guest}｜${e.title}</div><div class="choice-details">${state.selectedFields.map(f=>`<div class="choice-detail"><b>${f}：</b>${fieldValue(e,f)}</div>`).join('')}</div></div>`).join('')}
function fieldValue(e,f){return ({主题:e.topics.join('／'),嘉宾:e.guest,摘要:e.summary,评论:`${e.commentCount}条评论 · ${e.comments}`,时长:e.duration,热度:compactNumber(e.plays)+'次播放'})[f]}
function rankHTML(){return state.ranking.map((x,i)=>`<div class="rank-item" draggable="true" data-rank-index="${i}"><div class="rank-num">${i+1}</div><div class="drag-handle" aria-hidden="true">⋮⋮</div><b>${x}</b></div>`).join('')}
function bindRankDrag(){let from=null;document.querySelectorAll('.rank-item').forEach(item=>{item.ondragstart=()=>{from=+item.dataset.rankIndex;item.classList.add('dragging')};item.ondragend=()=>{item.classList.remove('dragging');document.querySelectorAll('.rank-item').forEach(x=>x.classList.remove('drag-over'))};item.ondragover=e=>{e.preventDefault();item.classList.add('drag-over')};item.ondragleave=()=>item.classList.remove('drag-over');item.ondrop=e=>{e.preventDefault();const to=+item.dataset.rankIndex;if(from===null||from===to)return;const [moved]=state.ranking.splice(from,1);state.ranking.splice(to,0,moved);log('ranking_drag',moved,{from,to});save();document.querySelector('#rankList').innerHTML=rankHTML();bindRankDrag()}})}
function researchView(){return wrap(`<div class="eyebrow">Researcher console</div><h1>研究执行台</h1><div class="research-grid"><aside class="card side-nav"><b>${state.participantId}</b><p class="muted">当前阶段：${labels[steps.indexOf(state.step)]}</p><button onclick="researchJump('intro')">返回参与者视图</button><button onclick="exportCSV()">导出 CSV</button><button onclick="exportJSON()">导出 JSON</button><button onclick="markInterrupted()">标记异常中断</button><button onclick="resetStudy()" style="color:var(--rose)">新建参与者</button></aside><div><div class="grid-3"><div class="stat"><small>事件数</small><br><b>${state.events.length}</b></div><div class="stat"><small>Task 1</small><br><b>${state.task1Index}/4</b></div><div class="stat"><small>Task 2-B</small><br><b>${state.t2bIndex}/12</b></div></div><div class="card"><h2>阶段跳转</h2><div class="field-options">${steps.map((s,i)=>`<button class="ghost" onclick="researchJump('${s}')">${i+1}. ${labels[i]}</button>`).join('')}</div></div><div class="card"><h2>最近行为日志</h2><div class="logbox">${state.events.slice(-60).reverse().map(e=>`${e.at}  ${e.type}  ${e.target}  ${JSON.stringify(e.payload)}<br>`).join('')||'暂无记录'}</div></div></div></div>`)}
function researchJump(step){if(step==='t1')state.task1Index=0;if(step==='t2a')state.t2aIndex=0;if(step==='t2b')state.t2bIndex=0;if(step==='t2c')state.selectedFields=[];setStep(step)}
function finishT1(status){const q=task1[state.task1Index],duration=stopTimer();state.answers[q.id]={status,duration,answer:document.querySelector('#t1answer')?.value||''};log('task1_complete',q.id,state.answers[q.id]);state.task1Index++;if(state.task1Index>=4)setStep('t1feedback');else setStep('t1')}
function finishT2A(status){const duration=stopTimer(),id='T2A-'+(state.t2aIndex+1);state.answers[id]={status,duration,selected:state.answers.currentEpisode||''};delete state.answers.currentEpisode;log('task2a_complete',id,state.answers[id]);state.t2aIndex++;if(state.t2aIndex>=4)setStep('t2b');else setStep('t2a')}
function exportJSON(){download(`${state.participantId}.json`,JSON.stringify(state,null,2),'application/json')}
function exportCSV(){const rows=[['participant_id','module','trial','event_type','target','timestamp','payload'],...state.events.map(e=>[state.participantId,state.step,e.payload?.trial||'',e.type,e.target,e.at,JSON.stringify(e.payload)])];download(`${state.participantId}.csv`,rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);log('export',name)}
function markInterrupted(){state.answers.interrupted={at:new Date().toISOString(),step:state.step};save();toast('已标记异常中断')}
function resetStudy(){if(!confirm('重新开始将清除当前进度和所有作答，并创建新的参与者记录。确定继续吗？'))return;localStorage.removeItem('yzhStudyState');location.reload()}
document.querySelector('#backBtn').onclick=goBack;
document.querySelector('#restartBtn').onclick=resetStudy;
document.querySelector('#researchBtn').onclick=()=>{document.querySelector('#researchGate').classList.remove('hidden');document.querySelector('#researchCode').focus()};
document.querySelector('#researchCancel').onclick=()=>document.querySelector('#researchGate').classList.add('hidden');
document.querySelector('#researchEnter').onclick=()=>{const code=document.querySelector('#researchCode').value;const configuredCode=window.YZH_STUDY_CONFIG?.researcherAccessCode||'';if(!configuredCode){toast('研究者访问尚未配置');return}if(code===configuredCode){document.querySelector('#researchGate').classList.add('hidden');document.querySelector('#researchCode').value='';stopTimer();app.innerHTML=researchView();updateHeader();log('researcher_view')}else toast('访问码不正确')};
document.addEventListener('change',e=>{if(e.target.id==='consentStudy'||e.target.id==='consentScreen'){document.querySelector('#consentNext').disabled=!(document.querySelector('#consentStudy').checked&&document.querySelector('#consentScreen').checked)}if(e.target.id==='screenReady'||e.target.id==='notifyReady'){document.querySelector('#t1Begin').disabled=!(document.querySelector('#screenReady').checked&&document.querySelector('#notifyReady').checked)}});
document.addEventListener('submit',e=>{if(e.target.id==='preForm'){e.preventDefault();const fd=new FormData(e.target);state.answers.pre={age:fd.get('age'),frequency:fd.get('frequency'),platforms:fd.getAll('platform'),discovery:fd.get('discovery'),familiarity:fd.get('familiarity')};log('pre_submit','',state.answers.pre);setStep('t1intro')}});
document.addEventListener('click',e=>{
 if(e.target.id==='consentNext'){state.answers.consent={study:true,screen:true,version:'V3.0-prototype',at:new Date().toISOString()};log('consent','',state.answers.consent);setStep('pre')}
 if(e.target.id==='t1Begin'){state.task1Index=0;log('task1_start');setStep('t1')}
 if(e.target.id==='feedbackSubmit'){const out={};document.querySelectorAll('#feedbackForm [data-question]').forEach(q=>out[q.dataset.question]=q.querySelector('[data-value]').dataset.value||'NA');state.answers.task1Feedback=out;log('task1_feedback','',out);setStep('t2a')}
 if(e.target.id==='t2bNext'){const vals=[...document.querySelectorAll('[data-value]')].map(x=>x.dataset.value);if(vals.some(v=>!v)){toast('请完成两项评分');return}const conditions=[];['A','B','C','D'].forEach(s=>[5,10,15].forEach(n=>conditions.push({s,n})));state.answers['T2B-'+state.t2bIndex]={condition:conditions[state.t2bIndex],clarity:+vals[0],crowding:+vals[1],duration:stopTimer()};log('task2b_rating','',state.answers['T2B-'+state.t2bIndex]);state.t2bIndex++;if(state.t2bIndex>=12)setStep('t2c');else setStep('t2b')}
 const row=e.target.closest('[data-choice]');if(row){state.answers.t2cEpisode=row.dataset.choice;document.querySelectorAll('[data-choice]').forEach(r=>r.classList.toggle('selected',r.dataset.choice===row.dataset.choice));document.querySelector('#confirmChoice').disabled=false;log('choice_episode',row.dataset.choice)}
 if(e.target.id==='confirmChoice'){state.answers.t2cDecisionMs=Date.now()-(state.answers.t2cStart||Date.now());log('t2c_confirm',state.answers.t2cEpisode,{fields:state.selectedFields});setStep('t2cfb')}
 if(e.target.id==='choiceFeedback'){const conf=document.querySelector('[data-question="confidence"] [data-value]').dataset.value;if(!conf){toast('请选择信心评分');return}const helpful=[...document.querySelectorAll('#helpful input:checked')].map(x=>x.value);if(helpful.length>3){toast('帮助信息最多选择3项');return}state.answers.t2cFeedback={confidence:+conf,helpful,reason:document.querySelector('#choiceReason').value};log('t2c_feedback','',state.answers.t2cFeedback);setStep('ranking')}
 if(e.target.id==='rankSubmit'){state.answers.importanceRanking=[...state.ranking];log('ranking_submit','',{ranking:state.ranking});setStep('interview')}
 if(e.target.id==='interviewStart'){state.answers.interviewStart=new Date().toISOString();startTimer();e.target.disabled=true;document.querySelector('#interviewEnd').disabled=false;log('interview_start')}
 if(e.target.id==='interviewEnd'){state.answers.interview={duration:stopTimer(),end:new Date().toISOString()};log('interview_end','',state.answers.interview);setStep('complete')}
});
document.addEventListener('change',e=>{
 if(e.target.closest('#fieldOptions')){const checked=[...document.querySelectorAll('#fieldOptions input:checked')];if(checked.length>3){e.target.checked=false;toast('最多同时显示3种信息');return}state.selectedFields=checked.map(x=>x.value);document.querySelector('#fieldCount').textContent=state.selectedFields.length;document.querySelectorAll('#fieldOptions input:not(:checked)').forEach(x=>x.disabled=state.selectedFields.length>=3);document.querySelector('#selectionList').innerHTML=episodeRows();log(e.target.checked?'field_add':'field_remove',e.target.value,{fields:[...state.selectedFields]});save()}
 if(e.target.closest('#helpful')){const c=[...document.querySelectorAll('#helpful input:checked')];if(c.length>3){e.target.checked=false;toast('最多选择3项')}}
});
const observer=new MutationObserver(()=>{if(state.step==='t2c'&&!state.answers.t2cStart){state.answers.t2cStart=Date.now();save()}});observer.observe(app,{childList:true});
render();
</script>
</body>
</html>
