<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>播客·用户研究</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="nav-group" aria-label="研究导航">
        <button class="nav-button" id="backButton" type="button">← 回到上一步</button>
        <button class="nav-button" id="restartButton" type="button">↻ 重新开始</button>
      </div>
      <div class="brand"><span class="brand-dot"></span><span>播客·用户研究</span></div>
      <div class="progress-region" aria-label="研究进度">
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <span class="step-label" id="stepLabel">研究说明</span>
      </div>
      <button class="nav-button researcher-button" id="researcherButton" type="button">研究者视图</button>
    </header>

    <main id="app" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="access-dialog" id="accessDialog">
    <form method="dialog" class="access-card" id="accessForm">
      <div class="eyebrow">Researcher access</div>
      <h2>进入研究者视图</h2>
      <p class="muted" id="accessHint">请输入本地研究者访问码。</p>
      <label class="field-label" for="accessCode">访问码</label>
      <input class="text-input" id="accessCode" type="password" autocomplete="off">
      <div class="form-actions">
        <button class="button secondary" value="cancel" type="button" id="accessCancel">取消</button>
        <button class="button" value="default" type="submit">进入</button>
      </div>
    </form>
  </dialog>

  <script src="study-materials.js"></script>
  <script src="app.js?v=researcher-access-2" defer></script>
</body>
</html>
